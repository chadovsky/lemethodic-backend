[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# F-325: pytest convention introduced here. Tests run against the local
# docker-compose Postgres — same DB the dev server uses. Each test
# module namespaces its fixtures (slug/email prefix) so concurrent runs
# don't collide with each other or with scripts/smoke_*.py runs.
addopts = -ra
