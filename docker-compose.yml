services:
  postgres:
    image: postgres:16-alpine
    container_name: fluentpath_postgres
    environment:
      POSTGRES_USER: fluentpath
      POSTGRES_PASSWORD: fluentpath_local_dev
      POSTGRES_DB: fluentpath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentpath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
